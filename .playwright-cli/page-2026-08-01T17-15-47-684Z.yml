    - generic [ref=f35e103]:
      - generic [ref=f35e104]:
        - heading "Enhancing Your Reputation and Ensuring Compliance" [level=2] [ref=f35e105]
        - paragraph [ref=f35e106]: At Spray Foam Insurance, we understand that your business thrives when it operates safely and responsibly. Our Safety and Compliance Support services are designed to empower you with the knowledge and tools you need to excel in your industry while minimizing risks.
      - generic [ref=f35e107]:
        - heading "Choose Spray Foam Insurance for Your Safety and Compliance Needs" [level=2] [ref=f35e108]
        - paragraph [ref=f35e109]: Our team specializes in providing Safety and Compliance Support tailored to the unique requirements of spray foam contractors. We're committed to helping you maintain safety, uphold compliance, and build a reputation for excellence in the spray foam industry.
        - paragraph [ref=f35e110]: Ready to discuss your insurance needs or have questions about Workers' Compensation Insurance? Contact Spray Foam Insurance today. We're here to help you navigate the world of insurance, so you can focus on what you do best – delivering exceptional spray foam solutions to your clients while ensuring the well-being of your team.
    - generic [ref=f35e112]:
      - heading "Safety & Compliance FAQs" [level=2] [ref=f35e113]
      - generic [ref=f35e114]:
        - generic [ref=f35e115]:
          - button "What respirator does OSHA require for spray foam application?" [ref=f35e116] [cursor=pointer]
          - paragraph [ref=f35e119]: OSHA requires at minimum a supplied-air respirator (SAR) type CE with full-face piece during spray application. Standard N95 masks are NOT sufficient for isocyanate exposure. After the resin cures (typically 24 hours), workers may re-enter with appropriate half-mask respirators with organic vapor/P100 cartridges.
        - generic [ref=f35e120]:
          - button "Do I need OSHA training certificates for my crew?" [ref=f35e121] [cursor=pointer]
          - paragraph [ref=f35e124]: OSHA HazCom training is required for all workers handling isocyanate chemicals. Manufacturer application certification is typically required for product warranties. Document all training for every crew member.
        - generic [ref=f35e125]:
          - button "Is spray foam considered hazardous by OSHA?" [ref=f35e126] [cursor=pointer]
          - paragraph [ref=f35e129]: The isocyanate component (B-side) is regulated as a hazardous chemical under OSHA HazCom. It can cause occupational asthma with repeated exposure. Proper PPE, ventilation, and training are non-negotiable.
        - generic [ref=f35e130]:
          - button "What insurance covers OSHA fines?" [ref=f35e131] [cursor=pointer]
          - paragraph [ref=f35e134]: Standard liability insurance does not cover OSHA fines, which are civil penalties. However, proper safety protocols reduce accident risk, keeping your Workers' Compensation and GL premiums lower and helping avoid claims.
        - generic [ref=f35e135]:
          - button "How does safety compliance affect my premiums?" [ref=f35e136] [cursor=pointer]
          - paragraph [ref=f35e139]: Insurers review your safety record, OSHA violation history, and training documentation when pricing policies. Contractors with documented safety programs and clean records typically receive better rates.
