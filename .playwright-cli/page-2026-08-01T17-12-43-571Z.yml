    - generic [ref=f17e123]:
      - heading "Inland Marine Insurance" [level=2] [ref=f17e124]
      - heading "Protect Your Property on the Move" [level=4] [ref=f17e125]
      - paragraph [ref=f17e126]: Inland marine insurance provides coverage for your property that is in transit, movable, or used for specialized purposes. Whether you're transporting goods, equipment, or valuable materials, inland marine insurance ensures you're protected against loss or damage while on the go.
      - paragraph [ref=f17e127]: At Spray Foam Insurance, we understand that certain items don't stay in one place and need coverage that travels with them. Our inland marine policies are designed to safeguard your high-value assets, ensuring peace of mind wherever your business takes you.
      - heading "What Does Inland Marine Insurance Cover?" [level=3] [ref=f17e128]
      - paragraph [ref=f17e129]: "Inland marine insurance covers a broad range of movable property, including:"
      - list [ref=f17e130]:
        - listitem [ref=f17e131]: "Tools & Equipment: Essential for contractors and business that frequently move equipment between job sites."
        - listitem [ref=f17e132]: "Goods in Transit: For businesses that ship products domestically, covering the transportation of goods via trucks, trains, or other land-based methods."
        - listitem [ref=f17e133]: "Fine Arts & Antiques: For collectors and businesses that transport valuable artwork or antiques."
        - listitem [ref=f17e134]: "Electronics: Ideal for technology companies or individuals who transport high-value electronics such as laptops, cameras, or servers."
        - listitem [ref=f17e135]: "Construction Materials: Covers the raw materials and supplies used for building or infrastructure projects while they are being transported or stored temporarily off-site."
      - heading "Why Inland Marine Insurance?" [level=3] [ref=f17e136]
      - paragraph [ref=f17e137]: "Many assume that standard property insurance will cover these items, but property insurance generally protects stationary property. Inland marine insurance provides the extra layer of protection for:"
      - list [ref=f17e138]:
        - listitem [ref=f17e139]: Mobile or Movable Property
        - listitem [ref=f17e140]: Property in Transit
        - listitem [ref=f17e141]: Property Temporarily Stores Off-Site
      - paragraph [ref=f17e142]: If you regularly transport goods or equipment, rely on technology in different locations, or have other valuable assets on the move, inland marine insurance is an essential addition to your coverage plan.
      - heading "Who Needs Inland Insurance?" [level=3] [ref=f17e143]
      - list [ref=f17e144]:
        - listitem [ref=f17e145]: "Contractors: Protect valuable equipment as you move from one job site to another."
        - listitem [ref=f17e146]: "Retailers & Wholesalers: Ensure goods are covered while being transported to customers or between business locations."
        - listitem [ref=f17e147]: "Art Collectors & Dealers: Secure coverages for high-value pieces while in transit or stored temporarily off-site."
        - listitem [ref=f17e148]: "IT Professionals: Safeguard servers, computers, and other technology equipment during transport or setup at client locations."
      - heading "Tailored Solutions For Your Business" [level=3] [ref=f17e149]
      - paragraph [ref=f17e150]: At Spray Foam Insurance, we provide customized inland marine insurance policies based on your unique needs. Our expert team will work with you to assess your risks and design a policy that covers your property while in motion or storage.
      - heading "Get a Quote Today!" [level=3] [ref=f17e151]
      - paragraph [ref=f17e152]: Don't leave your property unprotected while it's on the move. Contact Spray Foam Insurance today to learn more about inland marine insurance and get a personalized quote. Let us help you secure your assets, no matter where your business takes you.
