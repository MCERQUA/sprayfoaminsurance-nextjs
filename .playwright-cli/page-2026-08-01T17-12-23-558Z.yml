    - generic [ref=f14e66]:
      - text: ABOUT US
      - heading "We Listen And Work Together To Provide You The Best Coverage." [level=2] [ref=f14e67]
      - paragraph [ref=f14e68]: We like to listen to our customers because they know their business very well. Most of our clients have a lifetime of construction experience and they have tons of safety knowledge like work site safety training and applicator training. As much as you know about spray foam we know about spray foam contractors insurance. We try to ask only the questions we need in order to keep our time short on the phone. Once we have gathered your information we shop around for you. Our proprietary quote engine allows us to gather your information once and then shop your company with multiple carriers. We write thousands of contractors coast to coast every year.
    - generic [ref=f14e71]:
      - img "Josh Cotner - Spray Foam Insurance Specialist" [ref=f14e72]
      - generic [ref=f14e73]:
        - text: ABOUT US
        - heading "MY STORY" [level=3] [ref=f14e74]
        - generic [ref=f14e75]:
          - paragraph [ref=f14e76]: My name is Josh Cotner and I used to work in construction. I fell through a roof in 2005 and had a nightmare workers compensation claim. I needed to support my family and I learned a lot about liability and insurance during my recovery time. I had to fight the workers compensation company to get the results I was entitled to.
          - paragraph [ref=f14e77]: After my injury I learned a lot about insurance and the law and I started selling insurance with a National Contractors Insurance Company, RRG which was started by ABC Supply.
          - paragraph [ref=f14e78]: I worked with them for several years until the depression took its toll on the insurance carriers reserves. NCIC was shut down but all my roofers still needed coverage, so I worked and found other insurance companies to work with that liked writing roofing insurance.
          - paragraph [ref=f14e79]: I have sold a lot of insurance to contractors over the years and I have seen it all. I have helped thousands of spray foam contractors find affordable insurance, cover the construction risks, keep money in their pockets, and fight for coverage to pay claims for my clients.
        - generic [ref=f14e80]:
          - img "Josh Cotner" [ref=f14e81]
          - generic [ref=f14e82]:
            - paragraph [ref=f14e83]: Josh Cotner
            - paragraph [ref=f14e84]: (CEO / Founder)
