    - generic [ref=f14e122]:
      - heading "Frequently Asked Questions" [level=2] [ref=f14e123]
      - generic [ref=f14e124]:
        - generic [ref=f14e125]:
          - button "What makes Spray Foam Insurance different from a general agent?" [ref=f14e126] [cursor=pointer]
          - paragraph [ref=f14e129]: We focus exclusively on spray polyurethane foam contractors. That means we know the specific exclusions that trip up SPF contractors in standard policies, the carriers that price this risk fairly, and the coverage structures that actually protect you — not just check a box.
        - generic [ref=f14e130]:
          - button "Are you licensed to write coverage in my state?" [ref=f14e131] [cursor=pointer]
          - paragraph [ref=f14e134]: Yes. We place coverage for spray foam contractors in all 50 states. State licensing requirements, workers' comp rules, and bond requirements vary — we handle that complexity so you don't have to.
        - generic [ref=f14e135]:
          - button "How quickly can I get a quote?" [ref=f14e136] [cursor=pointer]
          - paragraph [ref=f14e139]: Most contractors receive quote options within 24 hours of submitting their application. For straightforward GL or auto policies, same-day quotes are often possible. Complex bundled programs may take an extra day for underwriting.
        - generic [ref=f14e140]:
          - button "What carriers do you work with?" [ref=f14e141] [cursor=pointer]
          - paragraph [ref=f14e144]: We work with multiple A-rated carriers who specialize in contractor and specialty trade insurance. We shop your risk across several markets to find you the best combination of coverage and price — and we're not captive to any single carrier.
        - generic [ref=f14e145]:
          - button "What if I already have insurance — can you review my existing coverage?" [ref=f14e146] [cursor=pointer]
          - paragraph [ref=f14e149]: Absolutely. We offer free policy reviews for spray foam contractors who want a second opinion. We'll identify any coverage gaps, exclusions, or misclassifications in your current program and let you know if we can do better.
