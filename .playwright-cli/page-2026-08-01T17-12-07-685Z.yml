          - heading "General liability" [level=3] [ref=f12e70]
          - paragraph [ref=f12e71]: Discover the comprehensive coverage you need to safeguard your spray foam contracting business. Our General Liability insurance is designed to shield you from unforeseen risks and give you the confidence to build a brighter future.
