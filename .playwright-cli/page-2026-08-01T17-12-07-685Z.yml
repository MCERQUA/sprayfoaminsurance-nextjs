        - generic [ref=f12e76]:
          - heading "Workers compensation" [level=3] [ref=f12e83]
          - paragraph [ref=f12e84]: Prioritize your team's well-being with our Workers' Compensation coverage. We're here to ensure your employees are protected, and your business remains secure in the face of workplace injuries. Explore how we can help you create a safer work environment.
          - generic [ref=f12e85]: Learn More
      - link [ref=f12e88] [cursor=pointer]:
        - /url: /services/commercial-auto/
        - generic [ref=f12e89]:
          - heading "Commercial auto" [level=3] [ref=f12e96]
          - paragraph [ref=f12e97]: Your business relies on wheels, and so do we. Our Commercial Auto Insurance ensures your vehicles stay on the road, so you can focus on what matters most—serving your clients. Explore how we can drive your success with tailored coverage.
          - generic [ref=f12e98]: Learn More
    - generic [ref=f12e102]:
      - heading "Protecting Your Business on the Move" [level=2] [ref=f12e103]
      - paragraph [ref=f12e104]: Spray foam contractors are known for their versatility and mobility, ensuring that their insulation expertise reaches clients far and wide. Whether it's transporting equipment to a job site or delivering finished projects, the road plays a vital role in your business operations. However, this mobility comes with its own set of risks and challenges, not only for your business but also for the environment. That's where Commercial Auto Insurance from Spray Foam Insurance becomes essential – it provides a protective shield for your business and ensures you can keep moving forward while safeguarding the environment.
      - generic [ref=f12e105]:
        - heading "Understanding the Essentials" [level=3] [ref=f12e106]
        - paragraph [ref=f12e107]: Commercial Auto Insurance is more than just a requirement; it's a smart investment for any business that relies on vehicles for its daily operations. This coverage is designed to protect your business in situations where your vehicles or employees are involved in accidents while on the job. It goes beyond protecting your assets; it's about protecting your reputation as a responsible and environmentally conscious contractor.
    - generic [ref=f12e109]:
      - heading "Why Is It Essential for Spray Foam Contractors?" [level=2] [ref=f12e111]
      - generic [ref=f12e112]:
        - generic [ref=f12e113]:
          - heading "Protecting Your Fleet" [level=3] [ref=f12e117]
          - paragraph [ref=f12e118]: Whether you have a single spray foam rig or a fleet of vehicles, they are vital assets to your business. Commercial Auto Insurance safeguards your investment by covering repairs or replacements in case of accidents, theft, or damage. This not only ensures business continuity but also minimizes the risk of environmental damage from spills during transportation.
        - generic [ref=f12e119]:
          - heading "Environmental Responsibility" [level=3] [ref=f12e123]
          - paragraph [ref=f12e124]: Spray foam contractors understand the environmental risks associated with their work. Transporting hazardous chemicals to job sites requires careful handling. In the unfortunate event of a spill, Commercial Auto Insurance can cover the costs of environmental cleanup, ensuring that the impact on the environment is minimized.
    - generic [ref=f12e127]:
      - heading "Key Components of Coverage" [level=2] [ref=f12e128]
      - paragraph [ref=f12e129]: "Commercial Auto Insurance from Spray Foam Insurance can be customized to meet your specific needs. Here are some key components of coverage:"
      - list [ref=f12e130]:
        - listitem [ref=f12e131]: "Collision Coverage: This covers the costs of repairing or replacing your vehicles if they are damaged in an accident."
        - listitem [ref=f12e132]: "Liability Coverage: Protection against claims of bodily injury or property damage that may result from an accident involving your vehicles."
        - listitem [ref=f12e133]: "Environmental Cleanup: Coverage for costs associated with environmental cleanup in the event of chemical spills."
    - generic [ref=f12e135]:
      - generic [ref=f12e136]:
        - heading "Ensuring Your Business Keeps Moving" [level=2] [ref=f12e137]
        - paragraph [ref=f12e138]: In the dynamic world of spray foam contracting, your mobility is a competitive advantage. Commercial Auto Insurance from Spray Foam Insurance ensures that you can keep your business on the move while fulfilling your responsibility to safeguard the environment. It's the safety net that provides peace of mind on the road and at the job site.
      - generic [ref=f12e139]:
        - heading "Choose Spray Foam Insurance For Your Commercial Auto Needs" [level=2] [ref=f12e140]
        - paragraph [ref=f12e141]: At Spray Foam Insurance, we specialize in providing Commercial Auto Insurance tailored to the unique requirements of spray foam contractors. Our experienced team understands the intricacies of your industry, and we're committed to ensuring your vehicles have the coverage they need to keep your business moving forward while preserving the environment.
        - paragraph [ref=f12e142]: Ready to discuss your insurance needs or have questions about Commercial Auto Insurance? Contact Spray Foam Insurance today. We're here to help you navigate the world of insurance, so you can focus on what you do best – delivering exceptional spray foam solutions to your clients while upholding your environmental responsibilities.
    - generic [ref=f12e144]:
      - heading "Frequently Asked Questions" [level=2] [ref=f12e145]
      - generic [ref=f12e146]:
        - generic [ref=f12e147]:
          - button "Do I need commercial auto if I only use my personal truck?" [ref=f12e148] [cursor=pointer]
          - paragraph [ref=f12e151]: Yes, if you use your personal vehicle for business purposes — like hauling equipment or driving between job sites — you need commercial auto coverage. Personal auto policies typically exclude business use, meaning a claim could be denied if you're driving for work.
        - generic [ref=f12e152]:
          - button "What is hired and non-owned auto coverage?" [ref=f12e153] [cursor=pointer]
          - paragraph [ref=f12e156]: Hired auto covers vehicles your business rents or leases. Non-owned auto covers vehicles owned personally by your employees when used for business purposes. Both are important for spray foam contractors who may use rental trucks or have employees running business errands in their personal vehicles.
        - generic [ref=f12e157]:
          - button "Does commercial auto cover my spray foam equipment inside the rig?" [ref=f12e158] [cursor=pointer]
          - paragraph [ref=f12e161]: The vehicle itself is covered, but the spray equipment inside it — proportioners, generators, hoses — is typically covered under a separate Inland Marine / Rig Insurance policy. We can bundle both coverages together for comprehensive protection.
        - generic [ref=f12e162]:
          - button "How are commercial auto rates calculated?" [ref=f12e163] [cursor=pointer]
          - paragraph [ref=f12e166]: Rates depend on the number and type of vehicles, drivers' MVR records, annual mileage, radius of operations, and your claims history. Spray foam rigs are rated differently than regular commercial trucks due to the hazardous materials they carry.
        - generic [ref=f12e167]:
          - button "Can I add drivers mid-policy?" [ref=f12e168] [cursor=pointer]
          - paragraph [ref=f12e171]: Yes. We can add or remove drivers from your policy as your team changes. New drivers are typically subject to an MVR check. It's important to list all regular drivers on the policy — unlisted drivers may not be covered in an accident.
    - generic [ref=f12e175]:
      - generic [ref=f12e176]:
        - heading "Ready to protect your business?" [level=2] [ref=f12e177]
        - paragraph [ref=f12e178]: Get specialized coverage built for spray foam contractors — fast, flexible, competitive.
