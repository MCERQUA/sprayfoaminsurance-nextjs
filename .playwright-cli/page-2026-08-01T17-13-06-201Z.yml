        - generic [ref=f20e708]: Got Questions?
        - heading "Frequently Asked Questions" [level=2] [ref=f20e709]
      - generic [ref=f20e710]:
        - generic [ref=f20e711]:
          - button "How much does spray foam insurance cost?" [ref=f20e712] [cursor=pointer]
          - paragraph [ref=f20e715]: Most spray foam contractors pay $2,500–$8,000 per year for a basic GL + workers' comp package. Rates depend on annual revenue, crew size, states of operation, claims history, and the specific coverages you carry. Larger commercial operations or those with prior claims may pay more.
        - generic [ref=f20e716]:
          - button "What insurance does a spray foam contractor need?" [ref=f20e717] [cursor=pointer]
          - paragraph [ref=f20e720]: At minimum, every SPF contractor needs General Liability Insurance (covering overspray, property damage, and bodily injury) and Workers' Compensation if you have employees. Most contractors also need Commercial Auto, Inland Marine / Rig Insurance, and Environmental Liability. Surety bonds are required for licensed contractor work in many states.
        - generic [ref=f20e721]:
          - button "Does standard GL cover spray foam overspray incidents?" [ref=f20e722] [cursor=pointer]
          - paragraph [ref=f20e725]: Most standard General Liability policies either exclude overspray damage or severely sub-limit it. Our SPF-specific GL policies include overspray coverage as standard, protecting you when wind-borne foam particles damage neighboring vehicles, siding, or landscaping.
        - generic [ref=f20e726]:
          - button "How fast can I get a certificate of insurance (COI)?" [ref=f20e727] [cursor=pointer]
          - paragraph [ref=f20e730]: Once your policy is bound and payment is processed, we typically issue certificates the same day — often within a few hours. We know contractors lose work waiting on paperwork, so fast COI service is a core part of what we do.
        - generic [ref=f20e731]:
          - button "Is workers' compensation required for spray foam contractors in every state?" [ref=f20e732] [cursor=pointer]
          - paragraph [ref=f20e735]: Workers' comp is mandatory in virtually every state as soon as you have one employee. The specific rules — including whether sole proprietors must cover themselves — vary by state. Operating without it can result in fines, stop-work orders, and direct personal liability for injured workers' medical bills and lost wages.
        - generic [ref=f20e736]:
          - button "Does my general liability policy cover pollution and chemical exposure claims?" [ref=f20e737] [cursor=pointer]
          - paragraph [ref=f20e740]: Standard GL policies contain a "pollution exclusion" that can bar coverage for chemical-related claims involving isocyanates and off-gassing. Environmental Liability Insurance fills this critical gap for SPF contractors. We recommend all spray foam contractors carry both GL and a pollution/environmental liability policy.
        - generic [ref=f20e741]:
          - button "How is my spray foam rig and equipment covered?" [ref=f20e742] [cursor=pointer]
          - paragraph [ref=f20e745]: Your spray foam rig — proportioner, heated hoses, generator, trailer, and tools — is covered under Inland Marine (also called Rig & Equipment Insurance). This coverage follows your equipment on the road, at job sites, and in storage. Commercial auto covers the vehicle itself but not the equipment inside.
        - generic [ref=f20e746]:
          - button "Do spray foam contractors need a surety bond?" [ref=f20e747] [cursor=pointer]
          - paragraph [ref=f20e750]: Many states require a contractor license bond as part of the licensing process. Commercial projects and general contractors may also require performance or payment bonds. Bonds guarantee your contractual performance — they are not insurance but work alongside it.
        - generic [ref=f20e751]:
          - button "Do my subcontractors need their own insurance?" [ref=f20e752] [cursor=pointer]
          - paragraph [ref=f20e755]: Yes. If your subcontractors lack their own GL or workers' comp coverage, you may be held liable as the statutory employer for their claims. Always verify current certificates of insurance from every subcontractor before work begins.
        - generic [ref=f20e756]:
          - button "Am I covered if I work in multiple states?" [ref=f20e757] [cursor=pointer]
          - paragraph [ref=f20e760]: Yes — we place coverage for spray foam contractors operating across all 50 states. Workers' comp must be endorsed for each state where you have employees, and we handle that coordination. Your GL and inland marine coverage typically follows you nationwide under a single policy.
        - generic [ref=f20e761]:
          - button "How quickly can I get insured?" [ref=f20e762] [cursor=pointer]
          - paragraph [ref=f20e765]: Most contractors can be quoted within 1 business day and fully bound within 2–3 business days. For straightforward GL or commercial auto risks, same-day binding is often possible. Call 844-967-5247 to start the process.
        - generic [ref=f20e766]:
          - button "What coverage protects against isocyanate exposure claims?" [ref=f20e767] [cursor=pointer]
          - paragraph [ref=f20e770]: Isocyanate-related claims — occupational asthma, sensitization, chemical exposure from MDI or TDI — are covered under a combination of Workers' Compensation (for employees), Environmental Liability (for third-party bodily injury and property damage), and General Liability (for bodily injury claims from building occupants).
