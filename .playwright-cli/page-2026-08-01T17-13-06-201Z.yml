          - paragraph [ref=f20e280]: Standard contractor policies carry exclusions that gut coverage the moment a spray foam claim comes in. Every policy we write is designed around SPF-specific exposures — overspray, off-gassing, chemical burns, adhesion failures.
        - generic [ref=f20e281]:
