    - generic [ref=f20e301]:
      - generic [ref=f20e302]:
        - generic [ref=f20e303]: Who We Serve
        - heading "Built for Every Spray Foam Operation" [level=2] [ref=f20e304]
        - paragraph [ref=f20e305]: From a one-rig residential crew to a multi-state commercial operation — we write coverage that fits your specific work, not a generic contractor template.
      - generic [ref=f20e306]:
        - generic [ref=f20e307]:
          - heading "Open-Cell Foam Applicators" [level=3] [ref=f20e313]
          - paragraph [ref=f20e314]: Soft-cell SPF presents off-gassing and improper-cure liability that standard GL policies exclude. Our open-cell coverage is written to close those gaps.
        - generic [ref=f20e315]:
          - heading "Closed-Cell Foam Applicators" [level=3] [ref=f20e321]
          - paragraph [ref=f20e322]: High-density SPF brings elevated risks — vapor barrier disputes, adhesion failures, and moisture claims. Policies built for closed-cell work, not generic construction.
        - generic [ref=f20e323]:
          - heading "SPF Roofing Contractors" [level=3] [ref=f20e328]
          - paragraph [ref=f20e329]: Roofing foam requires coverage for overspray drift, UV coating liability, and substrate adhesion claims. We understand SPF roof systems inside and out.
        - generic [ref=f20e330]:
          - heading "Residential Applicators" [level=3] [ref=f20e335]
          - paragraph [ref=f20e336]: Owner-occupied job sites demand extra diligence. Coverage for property damage, odor complaints, and accidental overspray on residential insulation projects.
        - generic [ref=f20e337]:
          - heading "Commercial & Industrial Contractors" [level=3] [ref=f20e343]
          - paragraph [ref=f20e344]: Warehouses, cold storage, and industrial facilities require higher limits and GC-specific endorsements. We place the coverage large-project owners demand.
        - generic [ref=f20e345]:
          - heading "New Construction & Retrofit" [level=3] [ref=f20e351]
          - paragraph [ref=f20e352]: Whether you're spraying a new build or retrofitting existing structures, your policy adapts to project type, timeline, and subcontractor insurance requirements.
