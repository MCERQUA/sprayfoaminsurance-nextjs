[build]
  command = "pnpm run build"
  publish = "out"

[build.environment]
  NEXT_DISABLE_TURBOPACK = "1"

[[redirects]]
  from = "/services/rig-equipment"
  to = "/inland-marine/spray_foam_rig_insurance"
  status = 301
  force = true

[[redirects]]
  from = "/services/rig-equipment/"
  to = "/inland-marine/spray_foam_rig_insurance/"
  status = 301
  force = true

[[redirects]]
  from = "/services/safety-and-compliance-support/"
  to = "/safety-and-compliance-support/"
  status = 301
  force = true

[[redirects]]
  from = "/services/Safety-and-Compliance-Support/"
  to = "/safety-and-compliance-support/"
  status = 301
  force = true

# LEAD DELIVERY (2026-08-27): handled by netlify/functions/submission-created.js, which is
# the path that actually fires — it flattens Netlify's {payload:{...}} wrapper into the flat
# body the lead pipeline expects. The six [[notifications]] webhook blocks briefly added here
# were inert (a raw wrapper posted straight to the pipeline arrives with no top-level `name`
# and is rejected as an empty submission), and if Netlify ever started honouring them they
# would have produced TWO lead records per submission. Removed deliberately — do not re-add
# without first retiring the function.
