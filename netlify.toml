[build]
  command = "pnpm run build"
  publish = "out"

[build.environment]
  NEXT_DISABLE_TURBOPACK = "1"

[[redirects]]
  from = "/services/rig-equipment"
  to = "/inland-marine/spray_foam_rig_insurance"
  status = 301
  force = true

[[redirects]]
  from = "/services/rig-equipment/"
  to = "/inland-marine/spray_foam_rig_insurance/"
  status = 301
  force = true

[[redirects]]
  from = "/services/safety-and-compliance-support/"
  to = "/safety-and-compliance-support/"
  status = 301
  force = true

[[redirects]]
  from = "/services/Safety-and-Compliance-Support/"
  to = "/safety-and-compliance-support/"
  status = 301
  force = true
