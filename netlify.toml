[build]
  command = "pnpm run build"
  publish = "out"

[build.environment]
  NEXT_DISABLE_TURBOPACK = "1"

[[redirects]]
  from = "/services/rig-equipment"
  to = "/inland-marine/spray_foam_rig_insurance"
  status = 301
  force = true

[[redirects]]
  from = "/services/rig-equipment/"
  to = "/inland-marine/spray_foam_rig_insurance/"
  status = 301
  force = true

[[redirects]]
  from = "/services/safety-and-compliance-support/"
  to = "/safety-and-compliance-support/"
  status = 301
  force = true

[[redirects]]
  from = "/services/Safety-and-Compliance-Support/"
  to = "/safety-and-compliance-support/"
  status = 301
  force = true

# ── LEAD DELIVERY (added 2026-08-27 by host, at Mike's direction) ──────────────
# Form DETECTION was off on this site (processing_settings.ignore_html_forms=true, the
# documented #1 lead-killer) — every submission would have been silently dropped. The flag
# is now false and a rebuild registered all six forms. These blocks are the other half:
# detection without delivery still loses the lead. In-repo because a git build RE-READS
# site config and drops API-added notifications (josh-site-deploy skill, 2026-06-20).

[[notifications]]
  form_name = "contact"
  [notifications.webhook]
    url = "https://josh.jam-bot.com/social-api/api/leads/webhook/netlify?tenant=josh&site=sprayfoaminsurance.com"
    events = ["submission_created"]

