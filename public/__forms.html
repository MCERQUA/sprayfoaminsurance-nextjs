<!--
  Netlify Forms detection file.
  Next.js App Router renders dynamically, so Netlify cannot scan rendered output
  for forms. This static file declares every form + all field names so Netlify's
  build registers them. The React forms POST url-encoded data here with the
  matching form-name:

    quote               → components/QuoteFormSection.tsx  (homepage)
    quote-detailed      → components/QuotePageForm.tsx     (/quote/)
    vegas-quote-request → components/VegasQuoteForm.tsx    (/vegas/)
    contact             → components/ContactForm.tsx       (/contact-us/)
    rig-quote           → components/RigQuoteForm.tsx      (/inland-marine/spray_foam_rig_insurance/)
    work-record         → app/spf-resources/work-record-form/page.tsx

  Delivery is Netlify Forms → netlify/functions/submission-created.js → the lead
  pipeline. There is deliberately NO client-side webhook fetch in any form; a
  second fire-and-forget POST duplicated every lead and swallowed its own errors.

  Field names match the lead pipeline (docs/WEBHOOK-DATAPOINTS.md) so leads flow
  Netlify → Social Dashboard → Zapier → AgencyZoom → AMS360 automatically.
  The person's name is ALWAYS a single field called `name` — never firstName /
  lastName / contact_name. Split name fields do not map to the pipeline's `name`
  and land as nameless leads.

  2026-11-14 (joshmac/desk-1): quote-detailed gained the full ACORD 125/126/140
  gap-fill (~34 required + 6 selections + 57 Yes/No + 35 conditional explain
  boxes + loss history + 15 strongly-recommended fields — see
  components/QuotePageForm.tsx for the YES_NO_QUESTIONS / FOLLOWUP_MAP source
  of truth). yn_* and ynExplain_* names are hand-registered here to match;
  regenerate this block from QuotePageForm.tsx's own arrays if either drifts.

  2026-11-14 (desk-1 follow-up patch): added general_* fields — real named
  detail-capture fields for the 14 "General" Yes/No checkboxes (subsidiary,
  parent, other insurance, negative financial action, judgement/lien,
  exposure, coverage terminated, past allegations, indicted/convicted,
  safety violations, trust, other ventures, drones x2) whose FIELDS.md spec
  previously gave only field COUNTS with no names. See GENERAL_DETAIL_MAP in
  components/QuotePageForm.tsx for the source of truth. Composite flat
  names: general_<ynQuestionKey>__<detailFieldKey>.
-->
